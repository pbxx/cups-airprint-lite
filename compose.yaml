name: cups-airprint-lite

services:
  cups:
    image: xpbxx/cups-airprint-lite:latest
    container_name: cups-airprint-lite
    hostname: cups-airprint-lite
    restart: unless-stopped

    # AirPrint discovery uses multicast DNS. Host networking lets the
    # advertisement reach the LAN and contain the host's usable address.
    network_mode: host

    # Required for USB device access and USB hotplug inside the container.
    privileged: true

    # Examples for non-USB devices. Host device names may differ.
    # devices:
      # - /dev/ttyUSB0:/dev/ttyUSB0 # USB-to-serial adapter
      # - /dev/ttyS0:/dev/ttyS0     # Built-in serial port
      # - /dev/lp0:/dev/lp0         # Parallel printer port
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # Persistent directories for CUPS config and spool
      - ./data/cups-config:/etc/cups
      - ./data/cups-spool:/var/spool/cups
    environment:
      CUPS_ADMIN_USER: admin
      CUPS_ADMIN_PASSWORD: change-me-to-a-strong-password
